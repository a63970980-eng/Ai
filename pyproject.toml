[project]
name = "ai-forex-trading-robot"
version = "0.1.0"
description = "Research-grade AI Forex trading system with risk controls, backtesting and broker adapters."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pandas>=2.2,<3",
  "numpy>=2.1,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.9,<1",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]
