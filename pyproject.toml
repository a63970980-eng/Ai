[project]
name = "ai-forex-trading-robot"
version = "0.2.0"
description = "Research-grade AI Forex trading system with risk controls, backtesting and broker adapters."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pandas>=2.2,<3",
  "numpy>=2.1,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
  "httpx>=0.27,<1",
]
research = [
  "vectorbt>=0.28",
  "scikit-learn>=1.5,<2",
]
observability = [
  "prometheus-client>=0.20,<1",
]
ai = [
  "litellm>=1.70,<2",
  "langgraph>=1.0,<2",
]

[tool.vercel]
entrypoint = "src.forex_robot.api:app"
