[project]
name = "ai-forex-trading-robot"
version = "0.2.0"
description = "Research-grade AI Forex trading system with risk controls, backtesting and broker adapters."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pandas>=2.2,<3",
  "numpy>=2.1,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
  "httpx>=0.27,<1",
]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.vercel]
entrypoint = "src.forex_robot.api:app"
